<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICT club member verification</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body{
            background-color: rgba(120, 0, 0, 0.79);
        }
        #HEADER{
            text-align: center; 
            padding: 2%; 
            padding-bottom: 1.5%;
            margin: 2%; 
            margin-top: 4%; 
            box-shadow: rgba(0, 0, 0, 0.3) 0px 3px 5px 3px; 
            justify-self: center; 
            border-radius: 25px; 
            background-color: whitesmoke;
        }
        #FORM{
            background-color: whitesmoke; 
            justify-self: center; 
            width: 50%; 
            margin: 3.5%; 
            padding: 5%;
            padding-bottom: 4%; 
            box-shadow: rgba(0, 0, 0, 0.3) 0px 3px 5px 3px; 
            border-radius: 25px;
        }
    </style>
</head>
<body>

    <div id="HEADER">
        <h1> (ó﹏ò｡)!! ICT club membership check </h1>
        <p class="text-muted">enter your details below to verify your membership !</p>
    </div>

    <div id="FORM">
        <div class="mb-3">
            <label for="first_name" class="form-label">first name:</label>
            <input type="text" id="first_name" class="form-control" placeholder="enter first name">
        </div>

        <div class="mb-3">
            <label for="last_name" class="form-label">last name:</label>
            <input type="text" id="last_name" class="form-control" placeholder="enter last name">
        </div>

        <button type="button" class="btn d-block" py-click="check_membership" style="margin: 3%; margin-top: 4.5%; width: 40%; justify-self: center; background-color:rgb(133, 16, 16); font-weight: bold; font-size: large; color: whitesmoke;">CHECK MEMBERSHIP</button>

        <div id="RESULTS">
            <p id="result_message" style="justify-self: center;">your membership status will appear here :)</p>
        </div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
